# Theatrical AutoPickpocket (theatrical/autopickpocket, in development): builds the DLLs, the self-test and
# the grid simulator with its own build.bat on a Windows runner, runs the simulator (fails if any simulated
# grid gets Henry caught) and attaches the mod archive and the development builds to the run.
name: Theatrical AutoPickpocket

on:
  push:
    paths:
      - 'theatrical/autopickpocket/**'
      - '.github/workflows/theatrical-autopickpocket.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: autopickpocket-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: theatrical/autopickpocket
    steps:
      - uses: actions/checkout@v5

      - name: Find the MSVC x64 tools
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw "no Visual Studio with the x64 C++ tools on this runner" }
          "KC_VCVARS=$vs\VC\Auxiliary\Build\vcvars64.bat" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build (build.bat)
        shell: cmd
        env:
          KC_AUTHOR: Flubbermunchkin
        run: call build.bat

      - name: Grid simulator
        shell: cmd
        run: out\dev\ppsim.exe 2000 1 && out\dev\ppsim.exe 2000 7

      - name: Package (tools/package.py)
        run: python tools\package.py

      - uses: actions/upload-artifact@v6
        with:
          name: autopickpocket-archive
          path: theatrical/autopickpocket/dist/*.zip
          if-no-files-found: error

      - uses: actions/upload-artifact@v6
        with:
          name: autopickpocket-dev
          path: theatrical/autopickpocket/out/dev/
          if-no-files-found: error
