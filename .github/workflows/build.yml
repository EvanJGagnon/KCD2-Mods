# Builds every mod on a Windows runner with the repo's own build.bat (published mods and the Theatrical
# Collection), runs the offline simulators, packages and audits the release archives with tools/package.py, and
# attaches one release archive for each mod (AutoMarksman includes all ranged weapons), and
# development builds with the test tools.
name: Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Find the MSVC x64 tools
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw "no Visual Studio with the x64 C++ tools on this runner" }
          "KC_VCVARS=$vs\VC\Auxiliary\Build\vcvars64.bat" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build (build.bat; also runs dicesim and marksim)
        shell: cmd
        env:
          KC_AUTHOR: Flubbermunchkin
        run: call build.bat

      - name: Offline simulators
        shell: cmd
        run: |
          type theatrical\automarksman\out\dev\marksim.txt | findstr /C:"ALL PASSED" || exit /b 1
          theatrical\autolockpick\out\dev\lpsim.exe 2000 1 || exit /b 1
          theatrical\autolockpick\out\dev\lpsim.exe 2000 7 || exit /b 1
          theatrical\autopickpocket\out\dev\ppsim.exe 2000 1 || exit /b 1
          theatrical\autopickpocket\out\dev\ppsim.exe 2000 7 || exit /b 1

      - name: Package and audit (tools/package.py)
        run: python tools\package.py

      - uses: actions/upload-artifact@v6
        with:
          name: release-archives
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
            dist/RELEASE_CONTENTS.txt
          if-no-files-found: error

      - uses: actions/upload-artifact@v6
        with:
          name: dev-builds
          path: |
            out/dev/
            theatrical/*/out/dev/
          if-no-files-found: error
