[Keys]
; switches the assist on/off (F1-F12, a letter or digit, or a symbol key such as ])
Toggle=F4

[Options]
; 1 = short ON/OFF message when you press the key (plus one status message after a save loads)
Notices=1
; which weapons the assist aims for (1 = on, 0 = left completely to you, camera and sway as vanilla)
Bows=1
HandCannons=1
Crossbows=1
; for bug reports: log the crossbow's firing pose every 250 ms (only with DebugLog=1)
CrossbowPoseDiagnostics=0
; 1 = assist already on when the game starts
StartEnabled=1
; a target is only taken within this many degrees of the centre of the view; looking further away
; from it while you move the mouse releases it
ConeDegrees=10
; and no farther than this (metres)
MaxDistance=80
; 1 (recommended): never lock onto an NPC behind solid terrain, walls, doors, or
; rigid cover. Uses CryPhysics collision rays from Henry and along the projectile's
; predicted arc. Fails closed if the native physics interface is unavailable.
; 0: previous behavior (no obstruction tests), for diagnosing rare false negatives.
RequireClearShot=1
; fastest the camera turns (degrees per second); lower = calmer, higher = snappier
TurnSpeed=115
; how quickly the remaining error is closed (per second)
Responsiveness=9
; 1 = people are only targeted while they are in combat; 0 = anyone you aim at
HostileOnly=0
; 1 = aim at the head bone of a person; 0 = estimate the head from the size of the body
HeadBone=1
; aim this far above the head bone (centimetres): the bone sits at the base of the skull
HeadAboveBoneCm=8
; without the head bone: aim this far below the top of a person (centimetres)
HeadDropCm=13
; after you move the mouse, the assist waits this long (milliseconds) before turning the camera again
HandsOffMs=400
; arrow speed (m/s) guessed until your first arrow has been measured (only used with BowPose=0 or when the bow can't be read)
ArrowSpeed=55
; 1 = remember the measured bow for the next session (kcd2_automarksman_calibration.txt)
RememberBow=1
; 1 = aim with the bow's own pose: the arrow leaves the bow's arrow joint along its axis, at the speed the
;     game's formula gives for this bow and arrow (0 = camera plus offsets measured from earlier arrows)
BowPose=1
; the game's own aim sway (it turns the view while you aim) while the assist is ON, in % of the game's:
;     100 = vanilla, 0 = none. Back to the game's own as soon as the assist is switched off.
SwayStrength=25
; per weapon (-1 = use SwayStrength)
SwayStrengthBow=-1
SwayStrengthCrossbow=-1
SwayStrengthGun=-1
; how the camera follows the bow's slow sway (milliseconds): the bow's tremor and frame-to-frame wobble are
;     filtered out. Lower = follows the sway more closely (more on the head, busier camera), higher = calmer
;     camera, the marker wanders more with the sway (the arrow goes where the bow points)
SwaySmoothingMs=100
; crossbows only (Crossbows=1): how much of the animated crossbow's own motion the camera follows, %.
;     40 reduces hunting; 0 is calmest but less precise on moving targets. Bows and hand cannons always use 100
CrossbowSwayRateGain=40
; the camera does not chase the last few centimetres: within this distance of the head it only follows the sway
HoldWithinCm=2
; the camera is only steered once the bow has been drawn and steady this long (milliseconds); while the bow is
;     raised or the next arrow is nocked its pose points far from the view and is never steered on
SettleMs=200
; 1 = aim ahead of walking or running targets
LeadMovingTargets=1
; what may be targeted (people always come first; horses and dogs are off so your own are left alone)
TargetPeople=1
TargetAnimals=1
TargetHorses=0
TargetDogs=0
; 1 = draw where the arrow would hit right now and the head (white): green = on the head bone, yellow = off it,
;     orange = the head is only estimated from the body's size (never green then)
ShowImpactMarker=1
; 1 = write a detailed log (for bug reports)
DebugLog=0
