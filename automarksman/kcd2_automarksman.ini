[Keys]
; switches the assist on/off (F1-F12, a letter or digit, or a symbol key such as ])
Toggle=F10

[Options]
; 1 = assist already on when the game starts
StartEnabled=0
; only targets within this many degrees of the centre of the view are picked
ConeDegrees=10
; and no farther than this (metres)
MaxDistance=80
; fastest the camera turns (degrees per second); lower = calmer, higher = snappier
TurnSpeed=115
; how quickly the remaining error is closed (per second)
Responsiveness=9
; aim this far below the top of a person (centimetres): the middle of the head
HeadDropCm=13
; after you move the mouse, the assist waits this long (milliseconds) before turning the camera again
HandsOffMs=400
; arrow speed (m/s) assumed until your first arrow has been measured
ArrowSpeed=55
; 1 = aim ahead of walking or running targets
LeadMovingTargets=1
TargetPeople=1
TargetAnimals=1
; 1 = write a detailed log (for testing and bug reports)
DebugLog=1
